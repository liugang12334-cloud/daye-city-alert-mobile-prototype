<title>大冶市城市智能预警平台 · 移动端原型（Demo）</title>
<!--
==================================================================================
 大冶市城市智能预警平台 · 移动端 Demo 原型（单文件 / 内联 CSS+JS / 无外部依赖）
 业务蓝本：01-资料阅读总结报告.md、06-业务流程逻辑与功能调整建议.md
 模拟数据：区域、责任单位、时间、预警级别均为演示虚构数据

 ★ 页面清单与跳转关系（→=页面跳转，⇢=弹窗/Toast，[]=底部Tab）
 -------------------------------------------------------------------------------
 [登录] login
   └→ home（账密 / 手机号验证码登录）

 [首页] home ────────────────────────────────────────────────────────────
   ├→ warn-detail（紧急工单横幅 / 待办卡片 / 最新预警卡片）
   ├→ signals（快捷入口「信号研判(2)」，值守角色可见）
  └⇢ roleSheet（角色条「切换角色」→ 弹窗选角色 → 确认）
   ├→ report（快捷入口「巡查上报」）
   ├→ todo（快捷入口「我的待办」）
   ├→ message（标题栏消息铃铛）
   ├→ risk-detail（今日火险预警卡整卡可点）
   ├→ signals（入口已全部收起：待办「待研判」段与《我的》菜单均已注释，代码保留可恢复）

 [预警] warn-list（3 个分段：火险预警 / 工单预警 / 应急响应）
   ├→ warn-detail（工单预警条目）
   ├→ risk-detail（火险预警条目，复用 warn-detail 渲染为火险模板）
   └→ flow（应急响应空态的「查看规则」）

 [上报] report（现场巡查上报表单：类型/区域/定位/描述/图片/紧急程度）
   └⇢ 提交成功弹窗 → my-reports（我的上报记录，新记录置顶）
        └→ warn-detail（若已被研判为工单，显示关联工单号）

 [待办] todo（分段：全部 / 待审批 / 待签收 / 待反馈 / 待核查；「待研判」为 PC 功能已收起）
   ├→ signals → judge（值守研判三分支，PC 功能：待办/我的入口均已收起，仅代码保留）
   │      ├⇢ 确认预警 → 自动生成工单（工单·黄/橙/红）→ warn-detail（状态=待派发）
   │      ├⇢ 待核查   → 生成核查工单 → 属地 1 小时内反馈
   │      └⇢ 误报     → 记录原因 → 解除预警
   └→ warn-detail（其余分段条目）

 [我的] mine
   ├→ my-reports（我的上报）
   ├→ flow（页面跳转关系 & 三套分级说明 & 演示说明）
   └→ 系统设置（消息通知 / 定位权限 / 值班排班 / 通讯录）

 工单详情 warn-detail（业务闭环中枢，按状态渲染不同底部操作）
   ├⇢ 带班领导审批（红色工单，待审批状态）
   ├⇢ 分级派发（待派发状态：选派发对象 + 短信/移动端双通道）
   ├⇢ 接单确认（待签收，5 分钟倒计时）
   ├⇢ 到场打卡（处置中，定位打卡，15/30/60 分钟到场计时）
   ├→ feedback（处置进展反馈，每 30 分钟一次）
   ├→ result-report（扑灭后 30 分钟内结果报告）
   ├→ verify（市局核查：通过 / 退回重办）
   ├⇢ 申请支援 / 建议启动Ⅳ级响应（红色工单 6 小时未扑灭）
   └→ flow（右上角「流程」）

 feedback / result-report 提交 → 回写工单时间轴 + 状态流转 → warn-detail
 verify 通过 → 办结销号 → 自动归档 Toast；退回 → 填原因 → 状态回退「处置中」

 消息 message → warn-detail（按关联工单跳转）
==================================================================================
-->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:#EDF1F7;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
 display:flex;align-items:center;justify-content:center;min-height:100vh;color:#1B2430;font-size:14px}
.phone{width:375px;height:812px;background:#fff;position:relative;overflow:hidden;border-radius:30px;border:9px solid #111827;
 box-shadow:0 18px 50px rgba(16,38,74,.22)}

#flowmap{display:none;width:600px;max-height:830px;overflow-y:auto;margin-left:40px;background:#fff;border-radius:18px;
 box-shadow:0 18px 50px rgba(16,38,74,.14);padding:24px 26px;box-sizing:border-box}
#flowmap .fm-title{font-size:17px;font-weight:700;color:#1B2430}
#flowmap .fm-sub{font-size:11px;color:#8A94A6;margin-top:4px}
#flowmap .fm-sec{font-size:13px;font-weight:600;color:#33404F;margin:18px 0 10px;padding-left:8px;border-left:3px solid #1668DC;line-height:16px}
#flowmap .fm-chain span{display:inline-block;background:#E8F1FE;color:#0F4C9B;font-size:11px;border-radius:6px;padding:4px 8px;margin:0 0 6px 0}
#flowmap .fm-chain i{font-style:normal;color:#9AA7B8;font-size:11px;margin:0 5px 6px 0}
#flowmap .fm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#flowmap .fm-cell{background:#F7F9FC;border-radius:10px;padding:10px 12px}
#flowmap .fm-cell .t{font-size:12px;font-weight:600;color:#1B2430}
#flowmap .fm-cell .t em{font-style:normal;color:#1668DC;font-size:10px;margin-left:4px}
#flowmap .fm-cell .d{font-size:11px;color:#6B7688;line-height:17px;margin-top:4px}
#flowmap .fm-kv{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:5px 0;border-bottom:1px dashed #EEF1F6}
#flowmap .fm-kv:last-child{border-bottom:none}
#flowmap .fm-kv .k{color:#8A94A6;flex:0 0 96px}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#F4F6FA}

.statusbar{height:30px;flex:0 0 30px;background:#0F4C9B;display:flex;align-items:center;justify-content:space-between;
 padding:0 16px;color:#fff;font-size:11px;letter-spacing:.3px}
.statusbar .sb-r{display:flex;align-items:center;gap:4px}
/* 标题栏 */
.navbar{height:46px;flex:0 0 46px;background:linear-gradient(135deg,#0F4C9B,#1668DC);color:#fff;display:flex;align-items:center;
 padding:0 8px;position:relative}
.navbar .nb-title{position:absolute;left:0;right:0;text-align:center;font-size:16px;font-weight:600;pointer-events:none}
.navbar .nb-btn{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;color:#fff}
.navbar .nb-btn.right{margin-left:auto;font-size:13px;font-weight:400;min-width:auto;padding:0 10px}
/* 视图区 */
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:#F4F6FA;padding-bottom:8px}

.sec-title{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;font-size:15px;font-weight:600;color:#1B2430}
.sec-title .more{font-size:12px;color:#8A94A6;font-weight:400}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between}
.muted{color:#8A94A6}
.small{font-size:12px}
.tiny{font-size:11px}
.b{font-weight:600}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.hr{height:1px;background:#EEF1F6;margin:12px 0}
/* 等级色 */
.lv{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;line-height:18px}
.lv-blue{color:#0B5FD0;background:#E8F1FE}
.lv-yellow{color:#A56A00;background:#FFF4DE}
.lv-orange{color:#C1510A;background:#FFEBDD}
.lv-red{color:#C21F1F;background:#FDE8E8}
.lv-resp{color:#6B4BE8;background:#EFEAFE}

.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
/* 按钮 */
.btn{flex:1;height:44px;border:none;border-radius:10px;background:#1668DC;color:#fff;font-size:15px;font-weight:600;
 display:flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:#fff;color:#1668DC;border:1px solid #B9D2F7}
.btn.warn{background:#E8590C}
.btn.danger{background:#D92B2B}
.btn.ok{background:#1E9E63}
.btn:active{opacity:.85}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px;flex:none;font-weight:500;border:none}
.btn-sm.pri{background:#1668DC;color:#fff}
.btn-sm.line{background:#fff;color:#1668DC;border:1px solid #B9D2F7}
.btn-sm.solid{background:#1668DC;color:#fff}
.btn-sm.gray{background:#F0F2F6;color:#6B7688}
/* 底部操作栏 */
.actionbar{flex:0 0 auto;background:#fff;border-top:1px solid #E6EAF2;padding:8px 12px calc(8px + env(safe-area-inset-bottom));

/* 表单 */
.form-item{padding:6px 14px;background:#fff;border-bottom:1px solid #F1F4F9;display:flex;align-items:flex-start;gap:6px}

.form-item .val{flex:1;font-size:14px;line-height:22px}
input,textarea,select{font-family:inherit;font-size:14px;color:#1B2430;border:none;outline:none;width:100%;background:transparent}
textarea{resize:none;min-height:60px;line-height:20px}
.pick{flex:1;display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:3px 9px;border-radius:14px;background:#F0F2F6;color:#4A5666;font-size:12px;border:1px solid transparent}
.chip.on{background:#E8F1FE;color:#1668DC;border-color:#9CC2F5;font-weight:600}
/* 上传图片格 */
.photos{display:flex;flex-wrap:wrap;gap:6px}
.ph{width:66px;height:66px;border-radius:8px;background:linear-gradient(160deg,#CFE3F7,#9CC2F5);position:relative;
 display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph .del{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;
 font-size:11px;display:flex;align-items:center;justify-content:center}
.ph.add{background:#F4F6FA;border:1px dashed #C6CFDC;color:#8A94A6;flex-direction:column;gap:2px;font-size:11px}
/* 时间轴 */
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:#E3E8F0}
.tl-item{position:relative;padding-bottom:14px}
.tl-item::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:#C6CFDC;border:2px solid #fff}
.tl-item.now::before{background:#1668DC;box-shadow:0 0 0 3px rgba(22,104,220,.18)}
.tl-item.red::before{background:#D92B2B}
/* 列表项 */
.li{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid #F1F4F9;background:#fff}
.li:active{background:#F7F9FC}
/* 倒计时 */
.cd{font-variant-numeric:tabular-nums;font-weight:600}
.cd.over{color:#D92B2B}
/* 统计格 */
.grid4{display:flex;background:#fff;border-radius:12px;margin:10px 12px;padding:12px 0;text-align:center}
.grid4>div{flex:1;position:relative}
.grid4>div+div::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:#EEF1F6}
.grid4 .n{font-size:20px;font-weight:700;line-height:26px}
/* 提示条 */
.tipbar{display:flex;gap:8px;align-items:flex-start;background:#FFF8E6;border:1px solid #FFE7AE;border-radius:10px;
 margin:10px 12px;padding:10px 12px;color:#8A5A00;font-size:12px;line-height:18px}
.banner{margin:10px 12px;border-radius:12px;padding:12px 14px;color:#fff;
 background:linear-gradient(135deg,#D92B2B,#A81515);box-shadow:0 4px 12px rgba(180,30,30,.22)}
.banner.o{background:linear-gradient(135deg,#E8590C,#C2410C)}
/* 弹层 */
.mask{position:absolute;inset:0;background:rgba(15,25,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;background:#fff;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:80%;overflow-y:auto}
.sheet h3{margin:0 0 4px;font-size:17px;text-align:center}
.sheet .sub{text-align:center;color:#8A94A6;font-size:12px;margin-bottom:14px}
.dialog{width:290px;background:#fff;border-radius:14px;padding:20px 18px 14px;text-align:center}
.dialog h3{margin:0 0 8px;font-size:16px}
.dialog p{margin:0 0 16px;font-size:13px;color:#6B7688;line-height:20px}
.toast{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);background:rgba(20,28,44,.9);color:#fff;
 padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;max-width:280px;text-align:center;line-height:20px}
.opt{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #F1F4F9}
.opt .rk{margin-left:auto;width:20px;height:20px;border-radius:50%;border:1.5px solid #C6CFDC}
.opt.on .rk{border-color:#1668DC;background:#1668DC;position:relative}
.opt.on .rk::after{content:"";position:absolute;left:6px;top:3px;width:5px;height:9px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
/* 空态 */
.empty{text-align:center;padding:48px 20px;color:#A6AEBC;font-size:13px}
.empty .ic{margin-bottom:10px}
/* 分段 */
.seg{display:flex;background:#fff;padding:8px 12px;gap:6px;position:sticky;top:0;z-index:5;border-bottom:1px solid #F1F4F9}
.seg div{flex:1;text-align:center;padding:7px 0;border-radius:8px;font-size:13px;color:#4A5666;background:#F4F6FA}
.seg div.on{background:#E8F1FE;color:#1668DC;font-weight:600}
.badge{display:inline-block;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#D92B2B;color:#fff;
 font-size:10px;line-height:16px;text-align:center;font-weight:600}
.kv{display:flex;justify-content:space-between;padding:7px 0;font-size:13px}
.kv .k{color:#8A94A6;flex:0 0 96px}
.kv .v{flex:1;text-align:right;color:#1B2430}
.loginbg{background:linear-gradient(160deg,#0F4C9B 0%,#1668DC 45%,#6FA8F5 100%);height:100%;display:flex;flex-direction:column;
 align-items:center;padding:52px 28px 28px;color:#fff}
</style>
</head>

function roleSel(k,el){
 var p=el.parentNode;
 for(var i=0;i<p.children.length;i++){p.children[i].classList.remove('on')}
 el.classList.add('on');S.tmpRole=k;
}
function roleOk(){
 var k=S.tmpRole||S.role;
 closeTop();
 if(k!==S.role){S.role=k;toast('已切换为：'+me().r+' · '+me().n)}
 else{toast('当前已是该角色')}
 S.tmpRole='';render();
}

/* ==================== 渲染 ==================== */
function render(){
 var p=PAGES[S.page];
 if(!p){S.page='home';p=PAGES.home}
 var nb=document.getElementById('navbar');
 if(p.noNav){nb.style.display='none';document.getElementById('statusbar').style.background='#0F4C9B'}
 else{
  nb.style.display='flex';
  var canBack=S.stack.length||S.page==='report';
  nb.innerHTML=(canBack?'<span class="nb-btn" onclick="back()">'+ICONS.back+'</span>':'<span class="nb-btn" style="width:8px"></span>')+
   '<span class="nb-title">'+esc(p.title)+'</span>'+
   '<span class="nb-btn right">'+(p.right||'')+'</span>';
 }
 var v=document.getElementById('view');
 v.innerHTML=p.html();
 v.scrollTop=0;
 var ab=document.getElementById('actionbar');
 if(p.bar){ab.className='actionbar';ab.innerHTML=p.bar()}else{ab.className='';ab.innerHTML=''}
 var tb=document.getElementById('tabbar');
 if(p.tab){
  tb.style.display='flex';
  var h='';
  TABS.forEach(function(t){
   var on=t.k===p.tab;
   h+='<div class="tab'+(on?' on':'')+(t.k==='report'?' mid':'')+'" onclick="tab(\''+t.k+'\')">'+
     '<span class="ic">'+(t.k==='home'?ICONS.home:(t.k==='warn'?ICONS.warn:(t.k==='report'?ICONS.plus:(t.k==='todo'?ICONS.task:ICONS.user))))+'</span>'+
     (t.k==='report'?'':'<span>'+t.t+'</span>')+'</div>';
  });
  tb.innerHTML=h;
 }else{tb.style.display='none'}
 tick();
}

/* 倒计时 */
function tick(){
 var els=document.querySelectorAll('.cd');
 for(var i=0;i<els.length;i++){
  var e=els[i],d=parseFloat(e.getAttribute('data-dl'));
  if(!d){e.textContent='—';continue}
  var left=d-Date.now();
  e.textContent=cdText(left);
  if(left<0){e.classList.add('over')}
 }
 var d=new Date(),p=function(x){return x<10?'0'+x:''+x};
 document.getElementById('sbtime').textContent=p(d.getHours())+':'+p(d.getMinutes());
}
setInterval(tick,1000);
render();
renderFlowmap();
</script>
